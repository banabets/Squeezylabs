<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Sin señal · Squeezy Labs</title>
<link rel="icon" href="/brand/squeezy.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Instrument+Serif:ital@0;1&display=swap">
<style>
  :root{--night:#0d1830;--sea:#1f8fa6;--sand:#f7ecd6;--lime:#a8ed00;--ink:#0c1d1b;--paper:#fbf7ee}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:linear-gradient(#0d1830,#2a3f6b 70%);color:var(--paper);font:16px/1.5 'DM Sans',Arial,sans-serif;display:grid;place-items:center;padding:24px;overflow:hidden}
  main{display:grid;justify-items:center;gap:18px;text-align:center;max-width:560px}
  svg{width:min(320px,80vw);height:auto;overflow:visible}
  h1{font:400 clamp(44px,9vw,76px)/.95 'Instrument Serif',Georgia,serif;margin:0}
  h1 em{color:var(--lime)}
  p{margin:0;opacity:.82}
  a{display:inline-flex;gap:10px;align-items:center;background:var(--lime);color:#13290c;text-decoration:none;font-weight:700;padding:14px 22px;border-radius:40px}
  a:focus-visible{outline:2px solid var(--paper);outline-offset:3px}
  .stars circle{animation:tw 3s ease-in-out infinite}
  .stars circle:nth-child(2n){animation-delay:1.2s}
  .stars circle:nth-child(3n){animation-delay:2.1s}
  .antenna{transform-origin:150px 132px;animation:search 3.2s ease-in-out infinite}
  .wave{fill:none;stroke:var(--lime);stroke-width:3;stroke-linecap:round;opacity:0;animation:ping 3.2s ease-out infinite}
  .wave.b{animation-delay:.4s}
  .eyes{transform-origin:150px 92px;animation:look 3.2s ease-in-out infinite}
  .body{animation:bob 2.6s ease-in-out infinite}
  @keyframes tw{50%{opacity:.25}}
  @keyframes search{0%,100%{transform:rotate(-22deg)}50%{transform:rotate(22deg)}}
  @keyframes look{0%,100%{transform:translateX(-4px)}50%{transform:translateX(4px)}}
  @keyframes ping{0%{opacity:0}40%{opacity:.9}100%{opacity:0;transform:scale(1.4)}}
  @keyframes bob{50%{transform:translateY(-4px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 300 240" role="img" aria-label="Squeezy, la mascota, busca señal con su antena sobre una isla de noche">
    <g class="stars" fill="#ffffff"><circle cx="30" cy="30" r="1.6"/><circle cx="80" cy="12" r="1.2"/><circle cx="250" cy="24" r="1.6"/><circle cx="214" cy="60" r="1.1"/><circle cx="54" cy="70" r="1"/><circle cx="276" cy="80" r="1.3"/></g>
    <path d="M0 214 l25 -6 l25 6 l25 -7 l25 7 l25 -6 l25 6 l25 -7 l25 7 l25 -6 l25 6 l25 -7 l25 7 v26 h-300z" fill="#1f8fa6"/>
    <ellipse cx="150" cy="210" rx="96" ry="16" fill="#f7ecd6"/>
    <g class="body">
      <g class="antenna">
        <rect x="148" y="40" width="4" height="92" rx="2" fill="#c9d1cf"/>
        <circle cx="150" cy="38" r="6" fill="#e9ffb0"/>
        <path class="wave" d="M136 26 q14 -14 28 0"/>
        <path class="wave b" d="M128 16 q22 -22 44 0"/>
      </g>
      <ellipse cx="150" cy="168" rx="34" ry="40" fill="#a8ed00"/>
      <ellipse cx="150" cy="104" rx="44" ry="36" fill="#a8ed00"/>
      <g class="eyes"><ellipse cx="135" cy="98" rx="9" ry="14" fill="#0c1d1b"/><ellipse cx="165" cy="98" rx="9" ry="14" fill="#0c1d1b"/><circle cx="132" cy="92" r="3" fill="#fff"/><circle cx="162" cy="92" r="3" fill="#fff"/></g>
      <ellipse cx="123" cy="114" rx="6" ry="3.5" fill="#ff8fa3"/><ellipse cx="177" cy="114" rx="6" ry="3.5" fill="#ff8fa3"/>
      <path d="M143 120 q7 -5 14 0" stroke="#0c1d1b" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M182 150 q22 -20 -28 -26" stroke="#a8ed00" stroke-width="12" fill="none" stroke-linecap="round"/>
    </g>
  </svg>
  <h1>404 · <em>sin señal,</em> pana</h1>
  <p>Squeezy está buscando esta página por toda la isla y no la encuentra. Puede que el enlace esté roto o que la página ya no exista.</p>
  <a href="/">Volver a la isla ↗</a>
</main>
</body>
</html>
